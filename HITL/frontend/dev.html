<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HITL Report Editor - Development</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 600px;
      }
      h1 {
        color: #2563eb;
        margin-bottom: 20px;
      }
      .status {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
      }
      .button {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 10px;
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 HITL Report Editor</h1>
      <div class="status">
        <h3>Development Mode</h3>
        <p>The React frontend is not built yet. To use the full modern interface:</p>
        <ol style="text-align: left; display: inline-block;">
          <li>Install Node.js from <a href="https://nodejs.org/" target="_blank">nodejs.org</a></li>
          <li>Run: <code>python build-frontend.py</code></li>
          <li>Restart the server</li>
        </ol>
      </div>
      <a href="/api/reports" class="button">Test API</a>
      <a href="/health" class="button">Health Check</a>
      <p style="margin-top: 30px; color: #666;">
        <small>Backend is running successfully! 🎉</small>
      </p>
    </div>
  </body>
</html>
